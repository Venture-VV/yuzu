# 自动测试（店主 2026-11-20 改成「按改动与风险挑选」，见 docs/TESTING.md 第 6 节）。只使用合成数据与一次性的 CI 数据库，不连接任何门店环境。
#
# 先由「测试计划」job 看这次改了什么（scripts/test-plan.mjs）：
#   · main 上的推送（每次合并）：全量——集成测试、浏览器验收、演示数据、从上一发布版本升级都跑；版本标签只打在全量通过的提交上。
#   · PR：按风险。改到资金、账本、加锁、权限、迁移、演示数据、测试与 CI 本身就全量；其余只跑受影响的用例 + 每次都跑的核心回归；
#     只改文档不跑运行时用例。要全量：PR 加 ci:full 标签，或提交信息里写 [ci full]。
# 静态检查（代码规范、类型、文档、治理基线、排版、迁移数据风险、秒级用例、构建、打包体积）每次都跑。
# 集成测试与浏览器验收按上次的用时均匀分到几个并行 job（scripts/ci/timings.json），汇总 job 核对计划里的一项不少、没有失败。
# 「CI 结论」job 写明这次是全量还是按改动挑选；任何一个该跑的 job 没过，整次 CI 失败。
#
# 运行机：GitHub 托管。2026-11-03 曾改到门店 Mac mini 的自托管运行机，店主 2026-11-05 嫌太慢改回。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: 测试计划（按改动与风险挑选）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      risk: ${{ steps.plan.outputs.risk }}
      integration: ${{ steps.plan.outputs.integration }}
      integration_count: ${{ steps.plan.outputs.integration_count }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e_count: ${{ steps.plan.outputs.e2e_count }}
      upgrade: ${{ steps.plan.outputs.upgrade }}
      demo: ${{ steps.plan.outputs.demo }}
      canteen: ${{ steps.plan.outputs.canteen }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 要比对这次改动、读提交信息
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 算测试计划（改了什么、风险多高、跑哪些、怎么分组）
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # PR 上 HEAD 是合并提交、main 上是刚合并的提交：第一父提交就是合并前的目标分支，两者之差就是这次的改动
          if [ "$EVENT" != "pull_request" ]; then export TEST_PLAN_FULL="main 上的推送：每次合并后全量（版本标签只打在全量通过的提交上）"; fi
          if [ "$FULL_LABEL" = "true" ]; then export TEST_PLAN_FULL="PR 带 ci:full 标签：全量"; fi
          if git log -1 --format=%B "$HEAD_SHA" | grep -qiF '[ci full]'; then export TEST_PLAN_FULL="提交信息写了 [ci full]：全量"; fi
          node scripts/test-plan.mjs --ci --base HEAD^1 --head HEAD
      - name: 交出测试计划（给两个汇总 job 核对）
        uses: actions/upload-artifact@v6
        with:
          name: test-plan
          path: test-plan.json
          retention-days: 7

  static:
    name: 静态检查 · 秒级用例 · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 迁移数据风险检查要比对目标分支
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 运维脚本静态检查（shellcheck）
        env:
          LC_ALL: C.UTF-8
        run: shellcheck -x -S warning -s bash scripts/*.sh scripts/lib/common.sh
      - name: 代码规范（oxlint；小程序线的目录不查）
        run: npm run lint
      - name: 类型检查与代码整洁（类型错误、没用到的导入与变量、事务里没等结果的查询、类型导入写法）
        run: npm run check:code
      - name: 文档检查（AGENTS.md 的体积预算、死链、文档索引、开发约定小节）
        run: npm run check:docs
      - name: 治理基线（分层、页面里的颜色与字号、大文件、没人引用的导出、重复率，只许持平或下降）
        run: npm run check:gov
      - name: 排版检查（Prettier；没过就本地跑 npm run format）
        run: npm run format:check
      - name: 迁移的数据风险（新迁移里删数据、改账本、改类型、重建作废约束要写明「风险已知」；已有迁移不许改）
        run: node scripts/check-migrations.mjs --base HEAD^1
      - name: 秒级用例（不要数据库的，每次全跑）
        run: npm run test:unit
      - run: npm run build
      - name: 打包体积（首屏主包不超过上限）
        run: npm run check:bundle

  integration:
    name: 集成测试（${{ matrix.name }}）
    needs: plan
    if: needs.plan.outputs.integration_count != '0'
    # 要 PostgreSQL 16 的 pg_dump / pg_restore（备份测试）：ubuntu-latest 换成 26.04 以后不带 16 版、apt 里也没有，固定用 24.04（自带 16）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.integration) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuzu
          POSTGRES_PASSWORD: yuzu_ci_only
          POSTGRES_DB: yuzu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuzu -d yuzu_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://yuzu:yuzu_ci_only@127.0.0.1:5432/yuzu_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: pg_dump / pg_restore 用 16 版（与数据库同一大版本，备份测试用）
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: 集成测试（这一组，约 ${{ matrix.seconds }} 秒的单进程用时）
        run: npx vitest run ${{ matrix.files }} --reporter=default --reporter=json --outputFile.json=vitest-results/${{ matrix.id }}.json
      - name: 交回这一组的结果（给汇总核对）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vitest-results-${{ matrix.id }}
          path: vitest-results
          if-no-files-found: ignore
          retention-days: 7

  # 名字沿用原来的「类型检查 · 集成测试 · 构建」（分支保护按名字认检查）：现在是汇总——静态检查通过、计划里的集成测试一项不少、没有失败
  test:
    name: 类型检查 · 集成测试 · 构建
    needs: [plan, static, integration]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 测试计划与静态检查都通过
        run: |
          echo "测试计划：${{ needs.plan.result }}；静态检查：${{ needs.static.result }}；集成测试分组：${{ needs.integration.result }}"
          [ "${{ needs.plan.result }}" = success ] || { echo "::error::测试计划没算出来"; exit 1; }
          [ "${{ needs.static.result }}" = success ] || { echo "::error::静态检查、秒级用例或构建没通过"; exit 1; }
      - name: 取回测试计划
        uses: actions/download-artifact@v7
        with:
          name: test-plan
      - name: 取回各组的结果
        if: needs.plan.outputs.integration_count != '0'
        uses: actions/download-artifact@v7
        with:
          pattern: vitest-results-*
          path: vitest-results
          merge-multiple: true
      - name: 核对
        run: |
          if [ "${{ needs.plan.outputs.integration_count }}" = 0 ]; then
            node -e 'const p=require("./test-plan.json"); if (p.integration.files.length) { console.error("::error::计划里有集成测试却没有分组"); process.exit(1) } console.log("这次的改动不用跑集成测试（" + p.reasons.join("；") + "）")'
          else
            node scripts/ci/vitest-summary.mjs test-plan.json vitest-results
          fi

  e2e:
    name: 浏览器验收（${{ matrix.name }}）
    needs: plan
    if: needs.plan.outputs.e2e_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.e2e) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuzu
          POSTGRES_PASSWORD: yuzu_ci_only
          POSTGRES_DB: yuzu_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuzu -d yuzu_e2e"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://yuzu:yuzu_ci_only@127.0.0.1:5432/yuzu_e2e
      APP_ENV: development
      PORT: 8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 写入合成演示数据（会员 + 库存采购 + 前台手牌 + 结账交班 + 旧账合成样例）
        run: |
          node dist/server/cli.js seed-demo
          node dist/server/cli.js seed-inventory-demo
          node dist/server/cli.js seed-frontdesk-demo
          node dist/server/cli.js seed-billing-demo
          node dist/server/cli.js seed-legacy-demo
          node dist/server/cli.js check
      - name: 启动应用
        run: |
          node dist/server/index.js > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          cat app.log; exit 1
      - name: 检查预装 Chromium 是否可用
        id: chromium_ready
        run: |
          if timeout 15s node -e 'const {chromium}=require("@playwright/test"); chromium.launch().then(async b=>{await b.close()}).catch(()=>process.exit(1))'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "当前版本的 Chromium 可用，跳过缓存恢复"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "当前版本的 Chromium 不可用，恢复缓存并执行安装"
          fi
      - name: 缓存 Playwright 浏览器（按依赖版本）
        if: steps.chromium_ready.outputs.ready != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: 浏览器验收（这一组，约 ${{ matrix.seconds }} 秒）
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-results/${{ matrix.id }}.json
        run: npx playwright test ${{ matrix.args }} --reporter=list,json
      - name: 浏览器验收改过数据之后再自检（会员、营业口径、库存、前台全部 ✓）
        run: node dist/server/cli.js check
      - name: 交回这一组的结果（给汇总核对）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-results-${{ matrix.id }}
          path: e2e-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 保留失败截图与日志
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failure-${{ matrix.id }}
          path: |
            test-results
            app.log
          retention-days: 7

  # 名字沿用原来的（分支保护按名字认检查）；现在核对的是测试计划里的各组
  e2e-summary:
    name: 浏览器验收汇总（三组都跑完、用例一项不少、没有失败）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [plan, e2e]
    # 有分组失败也要核对、写明哪一组；整次 CI 被取消（新的提交推上来）时不跑
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 测试计划算出来了
        run: '[ "${{ needs.plan.result }}" = success ] || { echo "::error::测试计划没算出来"; exit 1; }'
      - run: npm ci
        if: needs.plan.outputs.e2e_count != '0'
      - name: 取回测试计划
        uses: actions/download-artifact@v7
        with:
          name: test-plan
      - name: 取回各组的结果
        if: needs.plan.outputs.e2e_count != '0'
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-results-*
          path: e2e-results
          merge-multiple: true
      - name: 核对
        run: |
          if [ "${{ needs.plan.outputs.e2e_count }}" = 0 ]; then
            node -e 'const p=require("./test-plan.json"); if (p.e2e.units.length) { console.error("::error::计划里有浏览器用例却没有分组"); process.exit(1) } console.log("这次的改动不用跑浏览器验收（" + p.reasons.join("；") + "）")'
          else
            node scripts/ci/e2e-summary.mjs test-plan.json e2e-results
          fi

  demo:
    name: 演示数据：准备、重复执行与核对
    needs: plan
    if: needs.plan.outputs.demo == 'true'
    # 同上：demo-reset 先备份，要 16 版的 pg_dump
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuzu
          POSTGRES_PASSWORD: yuzu_ci_only
          POSTGRES_DB: yuzu_demo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuzu -d yuzu_demo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://yuzu:yuzu_ci_only@127.0.0.1:5432/yuzu_demo
      APP_ENV: development
      PORT: 8080
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 新库：demo-prepare 一次准备完（最后自带一致性自检与演示核对）
        run: |
          start=$(date +%s)
          node dist/server/cli.js demo-prepare
          echo "新库 demo-prepare 用时 $(( $(date +%s) - start )) 秒" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 一致性自检、演示核对，记下数据指纹
        id: fp
        run: |
          node dist/server/cli.js check
          node dist/server/cli.js demo-check
          echo "digest=$(node dist/server/cli.js fingerprint | tail -n 1)" >> "$GITHUB_OUTPUT"
      - name: 每日对账包（只读）：08-使用单.csv 带上演示的派对房使用单，数据指纹不变
        run: |
          node dist/server/cli.js daily-recon --out recon-demo
          f=$(ls recon-demo/*/08-使用单.csv | head -n 1)
          echo "对账包：$f"
          grep -q 'X201' "$f" || { echo "::error::08-使用单.csv 里没有演示的 X201 使用单"; cat "$f"; exit 1; }
          test "$(node dist/server/cli.js fingerprint | tail -n 1)" = "${{ steps.fp.outputs.digest }}" || { echo "::error::生成对账包改了数据"; exit 1; }
      - name: 再执行一次：全部跳过、数据指纹不变
        run: |
          node dist/server/cli.js demo-prepare | tee second.txt
          if grep -q '已写入' second.txt; then echo "::error::第二次执行又写入了数据"; exit 1; fi
          after=$(node dist/server/cli.js fingerprint | tail -n 1)
          [ "${{ steps.fp.outputs.digest }}" = "$after" ] || { echo "::error::第二次执行改动了数据：${{ steps.fp.outputs.digest }} → $after"; exit 1; }
      - name: 试用、正式环境：演示数据命令一律拒绝，什么都不写
        run: |
          before=$(node dist/server/cli.js fingerprint | tail -n 1)
          for env in trial production; do
            for cmd in demo-prepare demo-check demo-reset seed-demo seed-inventory-demo seed-frontdesk-demo seed-billing-demo seed-legacy-demo; do
              if APP_ENV=$env node dist/server/cli.js $cmd --confirm yuzu_demo > refuse.txt 2>&1; then
                echo "::error::APP_ENV=$env 时 $cmd 没有被拒绝"; cat refuse.txt; exit 1
              fi
              grep -q '禁止' refuse.txt || { echo "::error::APP_ENV=$env 时 $cmd 不是因为环境被拒绝"; cat refuse.txt; exit 1; }
            done
          done
          after=$(node dist/server/cli.js fingerprint | tail -n 1)
          [ "$before" = "$after" ] || { echo "::error::被拒绝的命令改动了数据：$before → $after"; exit 1; }
      - name: demo-reset：不写对库名、实例标识是测试服时拒绝
        run: |
          before=$(node dist/server/cli.js fingerprint | tail -n 1)
          if node dist/server/cli.js demo-reset > reset.txt 2>&1; then echo "::error::没写 --confirm 也执行了"; exit 1; fi
          grep -q -- '--confirm yuzu_demo' reset.txt || { cat reset.txt; exit 1; }
          if node dist/server/cli.js demo-reset --confirm yuzu_demo_x > reset.txt 2>&1; then echo "::error::库名写错也执行了"; exit 1; fi
          if YUZU_INSTANCE=test node dist/server/cli.js demo-reset --confirm yuzu_demo > reset.txt 2>&1; then echo "::error::测试服实例也执行了"; exit 1; fi
          grep -q 'YUZU_INSTANCE=test' reset.txt || { cat reset.txt; exit 1; }
          after=$(node dist/server/cli.js fingerprint | tail -n 1)
          [ "$before" = "$after" ] || { echo "::error::被拒绝的 demo-reset 改动了数据"; exit 1; }
      - name: 启动应用
        run: |
          node dist/server/index.js > app.log 2>&1 &
          echo $! > app.pid
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          cat app.log; exit 1
      - name: 检查预装 Chromium 是否可用
        id: chromium_ready
        run: |
          if timeout 15s node -e 'const {chromium}=require("@playwright/test"); chromium.launch().then(async b=>{await b.close()}).catch(()=>process.exit(1))'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "当前版本的 Chromium 可用，跳过缓存恢复"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "当前版本的 Chromium 不可用，恢复缓存并执行安装"
          fi
      - name: 缓存 Playwright 浏览器（按依赖版本）
        if: steps.chromium_ready.outputs.ready != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: 浏览器打开关键页面（只读，门店电脑尺寸）
        env:
          E2E_DEMO_SHOWCASE: '1'
        run: npx playwright test e2e/demo-showcase.spec.ts --project=门店电脑 --reporter=list
      - name: 浏览器核对之后再自检、演示核对
        run: |
          node dist/server/cli.js check
          node dist/server/cli.js demo-check
      - name: demo-reset：应用开着（空闲也算）时拒绝，不做备份，数据不变
        env:
          BACKUP_PATH: ${{ runner.temp }}/demo-backups-refused
        run: |
          mkdir -p "$BACKUP_PATH"
          before=$(node dist/server/cli.js fingerprint | tail -n 1)
          if node dist/server/cli.js demo-reset --confirm yuzu_demo > reset.txt 2>&1; then echo "::error::应用开着也清库了"; cat reset.txt; exit 1; fi
          grep -q '应用还开着' reset.txt || { echo "::error::不是因为应用开着被拒绝"; cat reset.txt; exit 1; }
          if ls "$BACKUP_PATH"/*.dump > /dev/null 2>&1; then echo "::error::应用开着时不该先做备份"; exit 1; fi
          after=$(node dist/server/cli.js fingerprint | tail -n 1)
          [ "$before" = "$after" ] || { echo "::error::被拒绝的 demo-reset 改动了数据"; exit 1; }
      - name: pg_dump / pg_restore 用 16 版（demo-reset 先备份）
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: demo-reset：停掉应用，先备份并在临时库恢复核验，再清库从零重建
        env:
          BACKUP_PATH: ${{ runner.temp }}/demo-backups
        run: |
          pid=$(cat app.pid); kill "$pid"
          for i in $(seq 1 20); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          start=$(date +%s)
          node dist/server/cli.js demo-reset --confirm yuzu_demo
          echo "demo-reset（备份 + 核验 + 重建）用时 $(( $(date +%s) - start )) 秒" | tee -a "$GITHUB_STEP_SUMMARY"
          ls "$BACKUP_PATH"/*-demo-reset.dump
          node dist/server/cli.js demo-check
      - name: 保留失败截图与日志
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: demo-failure
          path: |
            test-results
            app.log
          retention-days: 7

  upgrade:
    name: 从上一发布版本的演示库升级
    needs: plan
    if: needs.plan.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuzu
          POSTGRES_PASSWORD: yuzu_ci_only
          POSTGRES_DB: yuzu_upgrade
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuzu -d yuzu_upgrade"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://yuzu:yuzu_ci_only@127.0.0.1:5432/yuzu_upgrade
      APP_ENV: development
      PORT: 8080
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # 要用到版本标签与它们的提交
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: 找上一发布版本（目标分支上最新的版本标签）
        id: prev
        run: |
          # PR 上 HEAD 是合并提交、main 上是刚合并的提交：第一父提交就是合并前的目标分支；本次提交自己的标签（重跑时）不算
          tag=$(git tag --merged HEAD^1 --sort=-v:refname --list 'v[0-9]*' | head -n 1)
          if [ -z "$tag" ]; then echo "::notice::目标分支上还没有版本标签，跳过升级检查"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: 构建上一发布版本
        if: steps.prev.outputs.tag != ''
        run: |
          git worktree add --detach ../yuzu-prev "${{ steps.prev.outputs.tag }}"
          cd ../yuzu-prev
          npm ci
          npm run build
      - name: 上一发布版本：写入四套演示数据并自检
        if: steps.prev.outputs.tag != ''
        working-directory: ../yuzu-prev
        run: |
          node dist/server/cli.js seed-demo
          node dist/server/cli.js seed-inventory-demo
          node dist/server/cli.js seed-frontdesk-demo
          node dist/server/cli.js seed-billing-demo
          node dist/server/cli.js check
      - run: npm ci
        if: steps.prev.outputs.tag != ''
      - run: npm run build
        if: steps.prev.outputs.tag != ''
      - name: 本版本在升级后的库上启动（启动时自动迁移）并自检
        if: steps.prev.outputs.tag != ''
        run: |
          node dist/server/index.js > app.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && ok=1 && break; sleep 1; done
          echo
          if [ -z "$ok" ]; then cat app.log; exit 1; fi
          # 等启动时的那一轮每分钟任务跑完再停（会员到期处理等在半路被停，记录会停在「没跑完」，自检就报错）
          for i in $(seq 1 90); do grep -q '启动时的每分钟任务已跑完一轮' app.log && break; sleep 1; done
          # 停掉应用再核对：应用每分钟扫描一次到期赠金，会改数据
          kill "$pid"; wait "$pid" || true
          node dist/server/cli.js migrate
          node dist/server/cli.js check
      - name: 只读命令在升级后的库上可用（数据指纹、每日对账包、余额变动清单）
        if: steps.prev.outputs.tag != ''
        run: |
          before=$(node dist/server/cli.js fingerprint | tail -n 1)
          node dist/server/cli.js daily-recon --out recon
          node dist/server/cli.js balance-changes --since "$(date -u -d '-3 days' '+%Y-%m-%d %H:%M')" > balance-changes.csv
          after=$(node dist/server/cli.js fingerprint | tail -n 1)
          echo "$before"
          [ "$before" = "$after" ] || { echo "::error::只读命令改动了数据：$before → $after"; exit 1; }
      - name: 保留日志与对账包
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: upgrade-results
          path: |
            app.log
            recon
          retention-days: 7

  # 微信小程序（小程序线，docs/MINIPROGRAM.md 第 11 节）：miniprogram/ 自己的依赖；类型检查连同 src/shared/mp.ts 等共用类型，
  # 接口改了小程序这边会报错。单元测试不要微信开发者工具（页面在开发者工具与真机上测，见第 11 节）。
  miniprogram:
    name: 小程序：类型检查 · 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # 员工食堂 · 柚子饭堂（docs/CANTEEN.md 第 11 节）：应用开着员工端口（CANTEEN_PORT），在手机尺寸上走一遍——
  # 后台加人与开通卡片 → 厨师发布菜单 → 员工开通、点赞、亮码 → 负责人「从相册选」扫码、重复扫、断网补登、手动登记 → 后台记录。
  # 与平时的浏览器验收分开（playwright.canteen.config.ts、e2e-canteen/），不算进「浏览器验收汇总」的用例总数。
  canteen:
    name: 员工食堂：手机端浏览器验收
    needs: plan
    if: needs.plan.outputs.canteen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuzu
          POSTGRES_PASSWORD: yuzu_ci_only
          POSTGRES_DB: yuzu_canteen
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuzu -d yuzu_canteen"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://yuzu:yuzu_ci_only@127.0.0.1:5432/yuzu_canteen
      APP_ENV: development
      PORT: 8080
      CANTEEN_PORT: 8090
      # 只给 CI 的一次性库用，不是任何门店环境的密钥
      CANTEEN_CODE_SECRET: ci-only-canteen-code-secret-0123456789abcdef
      # 饭点提醒（docs/CANTEEN.md 第 19 节）：用例自己开模拟的推送服务（本机 http），只有开发、测试环境认这个开关
      CANTEEN_PUSH_LOCAL_ENDPOINTS: 'true'
      # 与 compose.canteen.yaml 的默认一样：局域网 http 打开（canteen-lan.local）的登录 Cookie 照样存得下（K18）
      CANTEEN_COOKIE_SECURE: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 写入合成演示数据（会员演示里有店主账号 linlan）
        run: node dist/server/cli.js seed-demo
      - name: 启动应用（员工后台 8080、员工端口 8090）
        run: |
          node dist/server/index.js > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/api/canteen/ping && exit 0; sleep 1; done
          cat app.log; exit 1
      - name: 检查预装 Chromium 是否可用
        id: chromium_ready
        run: |
          if timeout 15s node -e 'const {chromium}=require("@playwright/test"); chromium.launch().then(async b=>{await b.close()}).catch(()=>process.exit(1))'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 缓存 Playwright 浏览器（按依赖版本）
        if: steps.chromium_ready.outputs.ready != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: 员工食堂浏览器流程
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_CANTEEN_URL: http://localhost:8090
        run: npx playwright test -c playwright.canteen.config.ts
      - name: 走完之后自检（员工食堂不碰会员、库存、前台：全部 ✓）
        run: node dist/server/cli.js check
      - name: 保留截图（开通卡片、首页、饭卡码、扫码结果、后台）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: canteen-screens
          path: |
            test-results
            app.log
          retention-days: 7

  # 整次 CI 的结论：写明是全量还是按改动挑选；该跑的 job 都要通过，按计划不跑的可以跳过
  result:
    name: CI 结论（${{ needs.plan.outputs.mode == 'full' && '全量' || '按改动挑选' }}）
    needs: [plan, static, test, e2e-summary, demo, upgrade, canteen, miniprogram]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 核对各 job 的结果
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const plan = needs.plan.outputs ?? {};
            const optional = { demo: plan.demo === "true", upgrade: plan.upgrade === "true", canteen: plan.canteen === "true" };
            const bad = [];
            for (const [job, n] of Object.entries(needs)) {
              const planned = job in optional ? optional[job] : true;
              const ok = n.result === "success" || (!planned && n.result === "skipped");
              console.log(`${ok ? "✓" : "✗"} ${job}: ${n.result}${planned ? "" : "（按计划不跑）"}`);
              if (!ok) bad.push(job);
            }
            console.log(`方式：${plan.mode === "full" ? "全量" : "按改动挑选"}；风险：${plan.risk ?? "（没算出来）"}`);
            if (bad.length) { console.error(`::error::这些 job 没通过：${bad.join("、")}`); process.exit(1); }
          '
