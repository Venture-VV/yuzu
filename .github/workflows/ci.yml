# 自动测试：类型检查、后端集成测试（会员回归 + 库存 / 采购 / 应付 + 前台手牌核心校验 + 备份与恢复核验）、构建、
# 从上一发布版本的演示库升级后自检，以及真实浏览器验收（含完整收银流程与五种视口）。
# 只使用合成数据与一次性的 CI 数据库，不连接任何门店环境。
#
# 提速（v0.7.18，RQ-008，见 docs/TESTING.md）：各 job 同时开始，浏览器验收不再等测试 job；浏览器验收按文件名拆成三组
# 并行（门店电脑 a–l、门店电脑 m–z、其余四个尺寸），每组用自己的临时库与应用；「浏览器验收汇总」核对三组都跑完、
# 合计跑过的用例 = 不拆分时的总数、没有失败。集成测试按文件并行，每个进程用自己的测试库。任何一个 job 失败整次 CI 失败。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 类型检查 · 集成测试 · 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuzu
          POSTGRES_PASSWORD: yuzu_ci_only
          POSTGRES_DB: yuzu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuzu -d yuzu_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://yuzu:yuzu_ci_only@127.0.0.1:5432/yuzu_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: pg_dump / pg_restore 用 16 版（与数据库同一大版本，备份测试用）
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: 运维脚本静态检查（shellcheck）
        env:
          LC_ALL: C.UTF-8
        run: shellcheck -x -S warning -s bash scripts/*.sh scripts/lib/common.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: 浏览器验收（${{ matrix.name }}）
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # 按文件名首字母分组：新加的用例文件一定落在某一组里，不会漏跑（汇总 job 再核对总数）
          - group: store-a
            name: 门店电脑 · a–l
            args: "--project=门店电脑 'e2e/[a-l]'"
          - group: store-b
            name: 门店电脑 · m–z
            args: "--project=门店电脑 'e2e/[m-z]'"
          - group: others
            name: 平板、小屏电脑、手机
            args: --project=平板横屏 --project=平板竖屏 --project=小屏电脑 --project=手机
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuzu
          POSTGRES_PASSWORD: yuzu_ci_only
          POSTGRES_DB: yuzu_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuzu -d yuzu_e2e"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://yuzu:yuzu_ci_only@127.0.0.1:5432/yuzu_e2e
      APP_ENV: development
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 写入合成演示数据（会员 + 库存采购 + 前台手牌 + 结账交班 + 旧账合成样例）
        run: |
          node dist/server/cli.js seed-demo
          node dist/server/cli.js seed-inventory-demo
          node dist/server/cli.js seed-frontdesk-demo
          node dist/server/cli.js seed-billing-demo
          node dist/server/cli.js seed-legacy-demo
          node dist/server/cli.js check
      - name: 启动应用
        run: |
          node dist/server/index.js > app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && exit 0; sleep 1; done
          cat app.log; exit 1
      - name: 缓存 Playwright 浏览器（按依赖版本）
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: 浏览器验收（这一组）
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-results/${{ matrix.group }}.json
        run: npx playwright test ${{ matrix.args }} --reporter=list,json
      - name: 浏览器验收改过数据之后再自检（会员、营业口径、库存、前台全部 ✓）
        run: node dist/server/cli.js check
      - name: 交回这一组的结果（给汇总核对）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.group }}
          path: e2e-results
          if-no-files-found: ignore
          retention-days: 7
      - name: 保留失败截图与日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ matrix.group }}
          path: |
            test-results
            app.log
          retention-days: 7

  e2e-summary:
    name: 浏览器验收汇总（三组都跑完、用例一项不少、没有失败）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e
    # 有分组失败也要核对、写明哪一组；整次 CI 被取消（新的提交推上来）时不跑
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 取回三组的结果
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: e2e-results
          merge-multiple: true
      - name: 核对
        run: |
          total=$(npx playwright test --list | tail -n 1 | sed -E 's/^Total: ([0-9]+) tests?.*/\1/')
          echo "不拆分时的用例总数：$total"
          node scripts/ci/e2e-summary.mjs e2e-results 3 "$total"

  upgrade:
    name: 从上一发布版本的演示库升级
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuzu
          POSTGRES_PASSWORD: yuzu_ci_only
          POSTGRES_DB: yuzu_upgrade
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuzu -d yuzu_upgrade"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://yuzu:yuzu_ci_only@127.0.0.1:5432/yuzu_upgrade
      APP_ENV: development
      PORT: 8080
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要用到版本标签与它们的提交
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 找上一发布版本（目标分支上最新的版本标签）
        id: prev
        run: |
          # PR 上 HEAD 是合并提交、main 上是刚合并的提交：第一父提交就是合并前的目标分支；本次提交自己的标签（重跑时）不算
          tag=$(git tag --merged HEAD^1 --sort=-v:refname --list 'v[0-9]*' | head -n 1)
          if [ -z "$tag" ]; then echo "::notice::目标分支上还没有版本标签，跳过升级检查"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: 构建上一发布版本
        if: steps.prev.outputs.tag != ''
        run: |
          git worktree add --detach ../yuzu-prev "${{ steps.prev.outputs.tag }}"
          cd ../yuzu-prev
          npm ci
          npm run build
      - name: 上一发布版本：写入四套演示数据并自检
        if: steps.prev.outputs.tag != ''
        working-directory: ../yuzu-prev
        run: |
          node dist/server/cli.js seed-demo
          node dist/server/cli.js seed-inventory-demo
          node dist/server/cli.js seed-frontdesk-demo
          node dist/server/cli.js seed-billing-demo
          node dist/server/cli.js check
      - run: npm ci
        if: steps.prev.outputs.tag != ''
      - run: npm run build
        if: steps.prev.outputs.tag != ''
      - name: 本版本在升级后的库上启动（启动时自动迁移）并自检
        if: steps.prev.outputs.tag != ''
        run: |
          node dist/server/index.js > app.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && ok=1 && break; sleep 1; done
          echo
          if [ -z "$ok" ]; then cat app.log; exit 1; fi
          # 停掉应用再核对：应用每分钟扫描一次到期赠金，会改数据
          kill "$pid"; wait "$pid" || true
          node dist/server/cli.js migrate
          node dist/server/cli.js check
      - name: 只读命令在升级后的库上可用（数据指纹、每日对账包、余额变动清单）
        if: steps.prev.outputs.tag != ''
        run: |
          before=$(node dist/server/cli.js fingerprint | tail -n 1)
          node dist/server/cli.js daily-recon --out recon
          node dist/server/cli.js balance-changes --since "$(date -u -d '-3 days' '+%Y-%m-%d %H:%M')" > balance-changes.csv
          after=$(node dist/server/cli.js fingerprint | tail -n 1)
          echo "$before"
          [ "$before" = "$after" ] || { echo "::error::只读命令改动了数据：$before → $after"; exit 1; }
      - name: 保留日志与对账包
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-results
          path: |
            app.log
            recon
          retention-days: 7
