name: 自托管 Runner 临时验证
on:
  push:
    branches: [codex/yuzu-runner-bootstrap-20261103]
permissions:
  contents: read
jobs:
  smoke:
    name: Linux ARM64 · Docker · PostgreSQL · Chromium
    runs-on: [self-hosted, Linux, ARM64, yuzu-mini-ci-isolated]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yuzu_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: yuzu_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yuzu_ci -d yuzu_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查系统和数据库
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          docker version
          pg_isready -h 127.0.0.1 -p 5432 -U yuzu_ci -d yuzu_ci
          node --version
      - name: 安装锁定依赖
        run: npm ci --no-audit --no-fund
      - name: 启动 Chromium
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const page = await b.newPage();
            await page.setContent('<title>runner-smoke-ok</title>');
            if (await page.title() !== 'runner-smoke-ok') process.exitCode = 1;
            await b.close();
          })().catch(err => { console.error(err); process.exitCode = 1; });
          NODE
      - name: 验证 Actions 测试产物上传
        run: printf 'synthetic runner smoke\n' > runner-smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: self-hosted-runner-smoke
          path: runner-smoke.txt
          retention-days: 1
