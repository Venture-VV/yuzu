# 浴族 yuzu 运行环境（试用 / 正式）
#   启动：docker compose up -d --build
#   查看：docker compose ps / docker compose logs -f app
# 同一台机器上要同时跑试用和正式环境时，用不同的 .env 与项目名区分，数据卷互不影响：
#   docker compose --env-file .env.trial -p yuzu-trial up -d

# 每个服务的日志最多保留 5 个 10 MB 文件，不会把磁盘写满
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: yuzu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: yuzu
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuzu -d yuzu"]
      interval: 5s
      timeout: 5s
      retries: 30
    # 数据库不对局域网开放端口，只供 app 与 backup 容器访问
    logging: *logging

  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
        APP_VERSION: ${YUZU_VERSION:-8.0.5}
        APP_COMMIT: ${YUZU_COMMIT:-}
    # 不同 Compose 项目使用独立标签，演示构建不会覆盖试用 / 正式镜像。
    image: ${APP_IMAGE:-yuzu-app:${COMPOSE_PROJECT_NAME:-local}}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-trial}
      # 实例标识：prod 正式服 / shadow 影子运行 / test 测试服 / demo 演示库，页面常显
      YUZU_INSTANCE: ${YUZU_INSTANCE:-}
      DATABASE_URL: postgres://yuzu:${POSTGRES_PASSWORD}@db:5432/yuzu
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # 外网正式服走 HTTPS（反向代理 Caddy）时设 COOKIE_SECURE=true、TRUST_PROXY=<容器里看到的代理地址>：同一台主机上的 Caddy
      # 经发布的端口连进来时，容器里看到的是 Docker 网络的网关，不是 127.0.0.1（8.0.0，docs/RELEASE_V800.md 第 2.3 节第 7 条）
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      INIT_OWNER_USERNAME: ${INIT_OWNER_USERNAME:-}
      INIT_OWNER_PASSWORD: ${INIT_OWNER_PASSWORD:-}
      INIT_OWNER_NAME: ${INIT_OWNER_NAME:-店主}
      # 短信通道（8.0.4 批量发券的短信通知，.env.example 里有写法）：.env 里配了才传进容器，不配时短信留在待发箱、后台导出名单手动发
      # （Codex 自动审查 e726bc0：容器只认这里列出来的变量，原来没列，配了也发不出去）
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_ACCESS_KEY_ID: ${SMS_ACCESS_KEY_ID:-}
      SMS_ACCESS_KEY_SECRET: ${SMS_ACCESS_KEY_SECRET:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_COUPON: ${SMS_TEMPLATE_COUPON:-}
      SMS_ENDPOINT: ${SMS_ENDPOINT:-}
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
    # APP_PORT 只写端口（8080）时开在所有网卡上，门店局域网这样用；写成「地址:端口」只开在这个地址上：云服务器上写
    # 127.0.0.1:8080（只给本机的 Caddy）或 <Tailscale 地址>:8080——Docker 发布的端口会绕过主机防火墙，不能只靠 ufw 挡。
    # 已有实例两种写法都在用，这一行不要再拼别的变量（tests/compose-config.test.ts 核对两种写法都能展开）
    ports:
      - "${APP_PORT:-8080}:8080"
    logging: *logging

  # 备份服务：与 app 同一个镜像（含 pg_dump / pg_restore），由 app 构建、不从网上拉。
  # 每小时备份一次，每份都在临时库里试恢复、跑自检并记下数据指纹（写在备份旁的 .json 里）。
  backup:
    image: ${APP_IMAGE:-yuzu-app:${COMPOSE_PROJECT_NAME:-local}}
    pull_policy: never
    restart: unless-stopped
    # 写宿主机的备份目录（外置盘），与旧版备份容器一样用 root
    user: root
    command: ["node", "dist/server/cli.js", "backup-loop"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-trial}
      YUZU_INSTANCE: ${YUZU_INSTANCE:-}
      DATABASE_URL: postgres://yuzu:${POSTGRES_PASSWORD}@db:5432/yuzu
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      TZ: ${APP_TIMEZONE:-Asia/Shanghai}
      BACKUP_PATH: /backups
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-60}
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_HOURLY_KEEP_HOURS: ${BACKUP_HOURLY_KEEP_HOURS:-48}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_REQUIRE_SENTINEL: ${BACKUP_REQUIRE_SENTINEL:-false}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    # 镜像自带的健康检查是查网页服务，这个容器不提供网页
    healthcheck:
      disable: true
    logging: *logging

volumes:
  pgdata:
